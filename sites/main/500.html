/* Страница автономна: css/style.css сюда НЕ подключается, чтобы ошибка
   отрисовалась даже при сломанной отдаче статики. Токены и правила .btn*
   скопированы из css/style.css — правишь дизайн-систему, синхронизируй здесь. */
:root{
  --color-primary:#6C47FF; --color-primary-dark:#5533EE; --color-primary-rgb:108,71,255;
  --color-primary-mid:#8B6FFF; --color-primary-mid-rgb:139,111,255;
  --color-primary-soft:#A78BFA;                 /* нет в style.css: ссылка на тёмном фоне, hover */
  --color-link-on-dark:rgba(178,151,255,.85);   /* нет в style.css: ссылка на тёмном фоне */
  --color-error:#DC2626; --color-error-soft:#F87171; --color-error-rgb:220,38,38;
  --color-white:#FFFFFF; --color-white-rgb:255,255,255;
  --dark-bg:#0D0C1A; --dark-bg-2:#1A0E3A;       /* нет в style.css: второй стоп фона */
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --r-xl:24px; --r-full:9999px; --r-card:32px;  /* --r-card нет в style.css */
  --t:.2s ease;
  --fw-semibold:600; --fw-extrabold:800; --fw-black:900;
  --fs-14:14px; --fs-16:16px; --fs-17:17px; --fs-48:48px;
  --fs-error-code:clamp(96px,20vw,160px);       /* нет в style.css: только страницы состояний */
  --fs-error-title:clamp(20px,4vw,28px);
  --lh-none:1; --lh-relaxed:1.7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:linear-gradient(135deg,var(--dark-bg) 0%,var(--dark-bg-2) 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:var(--color-white)}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(var(--color-error-rgb),.1) 0%,transparent 55%),radial-gradient(ellipse at 70% 20%,rgba(var(--color-primary-rgb),.12) 0%,transparent 50%);pointer-events:none}
.card{background:rgba(var(--color-white-rgb),.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(var(--color-white-rgb),.1);border-radius:var(--r-card);padding:64px 48px;max-width:560px;width:100%;text-align:center;position:relative;z-index:1}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:48px;text-decoration:none;color:var(--color-white)}
.logo img{width:44px;height:44px;border-radius:50%}
.logo span{font-weight:var(--fw-extrabold);font-size:var(--fs-17);opacity:.9}
.code{font-size:var(--fs-error-code);font-weight:var(--fw-black);line-height:var(--lh-none);color:var(--color-error-soft)}
.emoji{font-size:var(--fs-48);margin:16px 0 0;display:block}
h1{font-size:var(--fs-error-title);font-weight:var(--fw-extrabold);margin:16px 0 12px}
p{color:rgba(var(--color-white-rgb),.6);font-size:var(--fs-16);line-height:var(--lh-relaxed);margin-bottom:36px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* общая кнопка сайта — .btn / .btn--lg / .btn--primary / .btn--ghost-dark */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:var(--fw-semibold);border:none;cursor:pointer;transition:all var(--t);text-decoration:none;white-space:nowrap;border-radius:var(--r-full)}
.btn--lg{font-size:var(--fs-16);padding:14px 28px;min-height:52px}
.btn--primary{background:var(--color-primary);color:var(--color-white);box-shadow:0 4px 14px rgba(var(--color-primary-rgb),.4)}
.btn--primary:hover{background:var(--color-primary-dark);box-shadow:0 6px 20px rgba(var(--color-primary-rgb),.5);transform:translateY(-1px)}
.btn--ghost-dark{background:rgba(var(--color-white-rgb),.1);color:rgba(var(--color-white-rgb),.7);border:1px solid rgba(var(--color-white-rgb),.15)}
.btn--ghost-dark:hover{background:rgba(var(--color-white-rgb),.2);color:var(--color-white)}
.contact{margin-top:32px;padding-top:24px;border-top:1px solid rgba(var(--color-white-rgb),.1);font-size:var(--fs-14);color:rgba(var(--color-white-rgb),.4)}
.contact a{color:var(--color-link-on-dark);font-weight:var(--fw-semibold);text-decoration:none}
.contact a:hover{color:var(--color-primary-soft)}
@media(max-width:500px){
  .card{padding:44px 24px;border-radius:var(--r-xl)}
  .actions{flex-direction:column}
  .actions .btn{justify-content:center}
}
</style>
